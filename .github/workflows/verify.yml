name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: git ls-files -z -- '*.lua' ':!:Data/**' | xargs -0 -n1 luac5.4 -p
      - name: Run Lua regressions
        run: lua5.4 tests/test_regressions.lua
      - name: Run scaffolder tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
